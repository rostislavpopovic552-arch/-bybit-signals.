<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bybit Historical Test</title>
<style>
body{font-family:Arial,sans-serif;background:#10151f;color:#eef2f7;padding:18px;max-width:850px;margin:auto}
h1{font-size:24px}
.small{color:#aab5c5}
button,select{padding:12px;border-radius:8px;border:0;font-size:16px;margin:5px 0}
button{background:#f0b90b;color:#111;font-weight:bold}
.card{background:#1b2636;padding:14px;border-radius:10px;margin:12px 0}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid #344154;padding:8px 0;gap:12px}
.good{color:#4ade80}.bad{color:#fb7185}
.day{border-bottom:1px solid #344154;padding:10px 0}
</style>
</head>
<body>
<h1>BYBIT HISTORICAL TEST</h1>
<p class="small">90 днів · 15-хвилинні свічки · цілі за останні 7 днів · Europe/Prague</p>.

<label for="coin">Монета:</label>
<select id="coin">
<option>BTCUSDT</option>
<option>ETHUSDT</option>
<option>SOLUSDT</option>
<option>XRPUSDT</option>
<option>DOGEUSDT</option>
</select>
<br>
<button id="start">Почати тест за 90 днів</button>
<div id="status" class="small"></div>
<div id="results"></div>

<script>
const API="https://api.bybit.com/v5/market/kline";
const INTERVAL=15;
const DAY=86400000;
const BAR=15*60000;
const ZONE="Europe/Prague";

function datePrague(ms){
  return new Intl.DateTimeFormat("en-CA",{
    timeZone:ZONE,year:"numeric",month:"2-digit",day:"2-digit"
  }).format(new Date(ms));
}
function fmt(n){
  return Number(n).toLocaleString("en-US",{maximumFractionDigits:8});
}
async function loadCandles(symbol){
  const now=Date.now();
  const end=now;
  const start=now-92*DAY;
  let all=[];
  let cursor=start;

  while(cursor<end){
    const batchEnd=Math.min(cursor+1000*BAR,end);
    const url=API+"?category=linear&symbol="+symbol+
      "&interval=15&start="+cursor+"&end="+batchEnd+"&limit=1000";
    const response=await fetch(url);
    const json=await response.json();

    if(json.retCode!==0) throw new Error(json.retMsg||"Помилка Bybit");

    const rows=json.result.list||[];
    all.push(...rows);
    cursor=batchEnd;
    document.getElementById("status").textContent=
      "Завантаження історії... "+all.length+" свічок";
    await new Promise(r=>setTimeout(r,150));
  }

  const map=new Map();
  for(const row of all){
    const t=Number(row[0]);
    if(t<start||t+BAR>now) continue;
    map.set(t,{
      time:t,
      open:Number(row[1]),
      high:Number(row[2]),
      low:Number(row[3]),
      close:Number(row[4])
    });
  }
  return [...map.values()].sort((a,b)=>a.time-b.time);
}

// Локальний максимум/мінімум вважається підтвердженим,
// лише якщо дві свічки праворуч уже закрилися до пробиття.
function findTarget(candles,index,direction){
  const entry=candles[index];
  const earliest=Math.max(2,index-7*24*4);
  let candidates=[];

  for(let i=earliest;i<=index-2;i++){
    const p=candles[i];
    if(direction==="up"){
      if(p.high>entry.close &&
         p.high>candles[i-1].high &&
         p.high>=candles[i-2].high &&
         p.high>=candles[i+1].high &&
         p.high>candles[i+2].high){
        candidates.push(p.high);
      }
    }else{
      if(p.low<entry.close &&
         p.low<candles[i-1].low &&
         p.low<=candles[i-2].low &&
         p.low<=candles[i+1].low &&
         p.low<candles[i+2].low){
        candidates.push(p.low);
      }
    }
  }

  if(!candidates.length) return null;

  // Найближчий підтверджений рівень у напрямку руху.
  return direction==="up"
    ? Math.min(...candidates)
    : Math.max(...candidates);
}

function analyze(candles){
  const daily={};
  for(const c of candles){
    const d=datePrague(c.time);
    if(!daily[d]) daily[d]={high:-Infinity,low:Infinity};
    daily[d].high=Math.max(daily[d].high,c.high);
    daily[d].low=Math.min(daily[d].low,c.low);
  }

  const dates=Object.keys(daily).sort();
  const results=[];
  const usedDays=new Set();

  for(let i=0;i<candles.length;i++){
    const c=candles[i];
    const day=datePrague(c.time);
    const dayIndex=dates.indexOf(day);
    if(dayIndex<1||usedDays.has(day)) continue;

    const previous=daily[dates[dayIndex-1]];
    let direction=null;

    if(c.close>previous.high) direction="up";
    else if(c.close<previous.low) direction="down";
    if(!direction) continue;

    usedDays.add(day);
    const target=findTarget(candles,i,direction);

    if(target===null){
      results.push({day,direction,status:"noTarget"});
      continue;
    }

    let outcome="expired";
    const limit=Math.min(candles.length-1,i+24*4);

    for(let j=i+1;j<=limit;j++){
      const next=candles[j];

      // Якщо ціна повернулася за рівень пробиття — хибне пробиття.
      if(direction==="up" && next.close<previous.high){
        outcome="false";
        break;
      }
      if(direction==="down" && next.close>previous.low){
        outcome="false";
        break;
      }

      // Перевіряємо досягнення цілі.
      if(direction==="up" && next.high>=target){
        outcome="success";
        break;
      }
      if(direction==="down" && next.low<=target){
        outcome="success";
        break;
      }
    }

    results.push({day,direction,target,status:outcome});
  }
  return results;
}

function showResults(candles,results,symbol){
  const success=results.filter(x=>x.status==="success").length;
  const falseBreak=results.filter(x=>x.status==="false").length;
  const noTarget=results.filter(x=>x.status==="noTarget").length;
  const expired=results.filter(x=>x.status==="expired").length;
  const evaluated=success+falseBreak+expired;
  const rate=evaluated?100*success/evaluated:0;

  let html='<div class="card"><h2>'+symbol+'</h2>';
  const stats=[
    ["Завантажено свічок",candles.length],
    ["Днів у даних",new Set(candles.map(c=>datePrague(c.time))).size],
    ["Пробиттів",results.length],
    ["Досягнуто цілі",success],
    ["Хибних пробиттів",falseBreak],
    ["Не було попередньої цілі",noTarget],
    ["Ціль не досягнута за 24 години",expired],
    ["Успішність серед оцінених",evaluated?rate.toFixed(1)+"%":"Немає даних"]
  ];
  for(const [name,value] of stats){
    html+='<div class="stat"><span>'+name+'</span><b>'+value+'</b></div>';
  }
  html+='</div>';
  html+='<p class="small">Успішність рахується лише серед пробиттів із визначеною ціллю. Це історичний результат, а не гарантія майбутньої угоди.</p>';
  html+='<h2>Результати по днях</h2>';

  for(const r of results.slice().reverse()){
    const direction=r.direction==="up"?"Вгору":"Вниз";
    let label="";
    if(r.status==="success") label="Ціль досягнута";
    if(r.status==="false") label="Хибне пробиття";
    if(r.status==="expired") label="Ціль не досягнута за 24 години";
    if(r.status==="noTarget") label="Немає попередньої локальної цілі";

    const cls=r.status==="success"?"good":
      r.status==="false"?"bad":"";
    html+='<div class="day"><b>'+r.day+' · '+direction+'</b><br>';
    if(r.target!==undefined) html+='Ціль: '+fmt(r.target)+' · ';
    html+='<span class="'+cls+'">'+label+'</span></div>';
  }

  document.getElementById("results").innerHTML=html;
}

document.getElementById("start").addEventListener("click",async()=>{
  const button=document.getElementById("start");
  const status=document.getElementById("status");
  const results=document.getElementById("results");
  button.disabled=true;
  results.innerHTML="";
  try{
    const symbol=document.getElementById("coin").value;
    status.textContent="Завантажую історичні свічки...";
    const candles=await loadCandles(symbol);
    if(candles.length<100) throw new Error("Недостатньо історичних даних.");
    status.textContent="Аналізую пробиття та цілі...";
    const data=analyze(candles);
    showResults(candles,data,symbol);
    status.textContent="Тест завершено. Свічок: "+candles.length;
  }catch(e){
    status.textContent="Помилка: "+e.message;
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
