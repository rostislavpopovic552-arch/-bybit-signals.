<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bybit Historical Test</title>
<style>
body{font-family:Arial,sans-serif;background:#10151f;color:#eef2f7;padding:18px;max-width:850px;margin:auto}
h1{font-size:24px}
.small{color:#aab5c5}
button,select{padding:12px;border-radius:8px;border:0;font-size:16px;margin:5px 0}
button{background:#f0b90b;color:#111;font-weight:bold}
button:disabled{opacity:.5}
.card{background:#1b2636;padding:14px;border-radius:10px;margin:12px 0}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid #344154;padding:8px 0;gap:12px}
.good{color:#4ade80}.bad{color:#fb7185}.warn{color:#fbbf24}
.day{border-bottom:1px solid #344154;padding:10px 0}
</style>
</head>
<body>
<h1>BYBIT HISTORICAL TEST</h1>
<p class="small">90 днів · 15-хвилинні свічки · цілі за останні 7 днів · Europe/Prague</p>

Монета:
<option>BTCUSDT</option>
<option>ETHUSDT</option>
<option selected>SOLUSDT</option>
<option>XRPUSDT</option>
<option>DOGEUSDT</option>
</select>
<br>
<button id="start">Почати тест за 90 днів</button>
<div id="status" class="small"></div>
<div id="results"></div>
<script>
const API="https://api.bybit.com/v5/market/kline";
const DAY=86400000;
const BAR=15*60000;
const ZONE="Europe/Prague";
const dateFormatter=new Intl.DateTimeFormat("en-CA",{
  timeZone:ZONE,year:"numeric",month:"2-digit",day:"2-digit"
});
function datePrague(ms){
  return dateFormatter.format(new Date(ms));
}
function localMidnight(dateString){
  const [y,m,d]=dateString.split("-").map(Number);
  const wanted=Date.UTC(y,m-1,d);
  let guess=wanted;
  for(let n=0;n<4;n++){
    const parts=Object.fromEntries(
      new Intl.DateTimeFormat("en-US",{
        timeZone:ZONE,year:"numeric",month:"2-digit",
        day:"2-digit",hour:"2-digit",minute:"2-digit",
        second:"2-digit",hourCycle:"h23"
      }).formatToParts(new Date(guess))
       .filter(x=>x.type!=="literal")
       .map(x=>[x.type,Number(x.value)])
    );
    const shown=Date.UTC(
      parts.year,parts.month-1,parts.day,
      parts.hour,parts.minute,parts.second
    );
    const diff=wanted-shown;
    guess+=diff;
    if(diff===0) break;
  }
  return guess;
}
function fmt(n){
  return Number(n).toLocaleString("en-US",{maximumFractionDigits:8});
}
async function loadCandles(symbol){
  const now=Date.now();
  const end=now;
  const start=now-92*DAY;
  let all=[];
  let cursor=start;
  while(cursor<end){
    const batchEnd=Math.min(cursor+1000*BAR,end);
    const url=API+"?category=linear&symbol="+symbol+
      "&interval=15&start="+cursor+"&end="+batchEnd+"&limit=1000";
    const response=await fetch(url);
    if(!response.ok) throw new Error("Помилка мережі Bybit: "+response.status);
    const json=await response.json();
    if(json.retCode!==0) throw new Error(json.retMsg||"Помилка Bybit");
    all.push(...(json.result.list||[]));
    cursor=batchEnd;
    document.getElementById("status").textContent=
      "Завантаження історії... "+all.length+" свічок";
    await new Promise(r=>setTimeout(r,180));
  }
  const map=new Map();
  for(const row of all){
    const t=Number(row[0]);
    if(t<start||t+BAR>now) continue;
    map.set(t,{
      time:t,
      open:Number(row[1]),
      high:Number(row[2]),
      low:Number(row[3]),
      close:Number(row[4])
    });
  }
  return [...map.values()].sort((a,b)=>a.time-b.time);
}
function buildDaily(candles){
  const daily={};
  for(const c of candles){
    const d=datePrague(c.time);
    if(!daily[d]) daily[d]={
      high:-Infinity,low:Infinity,count:0,
      first:c.time,last:c.time,valid:true
    };
    const x=daily[d];
    x.high=Math.max(x.high,c.high);
    x.low=Math.min(x.low,c.low);
    x.count++;
    x.first=Math.min(x.first,c.time);
    x.last=Math.max(x.last,c.time);
  }
  for(const d of Object.keys(daily)){
    const x=daily[d];
    const start=localMidnight(d);
    const next=new Date(start+36*60*60*1000);
    const nextDate=datePrague(next.getTime());
    const end=localMidnight(nextDate);
    const expected=(end-start)/BAR;
    x.valid=
      x.first===start &&
      x.last+BAR===end &&
      x.count===expected;
  }
  return daily;
}
// Ціль підтверджується двома свічками праворуч,
// але всі вони мають бути закриті до моменту входу.
function findTarget(candles,index,direction){
  const entry=candles[index];
  const earliest=Math.max(2,index-7*24*4);
  const candidates=[];
  for(let i=earliest;i<=index-2;i++){
    const p=candles[i];
    if(direction==="up"){
      if(p.high>entry.close &&
         p.high>candles[i-1].high &&
         p.high>=candles[i-2].high &&
         p.high>=candles[i+1].high &&
         p.high>candles[i+2].high){
        candidates.push(p.high);
      }
    }else{
      if(p.low<entry.close &&
         p.low<candles[i-1].low &&
         p.low<=candles[i-2].low &&
         p.low<=candles[i+1].low &&
         p.low<candles[i+2].low){
        candidates.push(p.low);
      }
    }
  }
  if(!candidates.length) return null;
  return direction==="up"
    ? Math.min(...candidates)
    : Math.max(...candidates);
}
function analyze(candles){
  const daily=buildDaily(candles);
  const results=[];
  const usedDays=new Set();
  // Останні 24 години не тестуємо:
  // для кожного сигналу потрібні повні 24 години майбутніх даних.
  for(let i=0;i<candles.length-96;i++){
    const c=candles[i];
    const day=datePrague(c.time);
    if(usedDays.has(day)) continue;
    const previousDate=new Date(
      localMidnight(day)-DAY
    );
    const prevDay=datePrague(previousDate.getTime());
    const previous=daily[prevDay];
    if(!previous || !previous.valid) continue;
    // Не починаємо пошук сигналу раніше початку дня.
    if(c.time<localMidnight(day)) continue;
    let direction=null;
    if(c.close>previous.high) direction="up";
    else if(c.close<previous.low) direction="down";
    if(!direction) continue;
    // Після першого пробиття цього дня інші не перевіряємо.
    usedDays.add(day);
    const target=findTarget(candles,i,direction);
    if(target===null){
      results.push({day,direction,status:"noTarget"});
      continue;
    }
    let outcome="expired";
    let complete=true;
    for(let j=i+1;j<=i+96;j++){
      const next=candles[j];
      // Якщо є пропуск у даних, результат не оцінюємо.
      if(next.time-candles[j-1].time!==BAR){
        complete=false;
        outcome="incomplete";
        break;
      }
      const returned=direction==="up"
        ? next.close<previous.high
        : next.close>previous.low;
      const reached=direction==="up"
        ? next.high>=target
        : next.low<=target;
      // В одній свічці невідомо, яка подія сталася першою.
      if(returned && reached){
        outcome="ambiguous";
        break;
      }
      if(returned){
        outcome="false";
        break;
      }
      if(reached){
        outcome="success";
        break;
      }
    }
    if(!complete && outcome==="incomplete"){
      results.push({day,direction,target,status:"incomplete"});
    }else{
      results.push({day,direction,target,status:outcome});
    }
  }
  return results;
}
function showResults(candles,results,symbol){
  const count=s=>results.filter(x=>x.status===s).length;
  const success=count("success");
  const falseBreak=count("false");
  const noTarget=count("noTarget");
  const expired=count("expired");
  const ambiguous=count("ambiguous");
  const incomplete=count("incomplete");
  const evaluated=success+falseBreak+expired;
  const rate=evaluated?100*success/evaluated:0;
  let html='<div class="card"><h2>'+symbol+'</h2>';
  const stats=[
    ["Завантажено свічок",candles.length],
    ["Днів у даних",new Set(candles.map(c=>datePrague(c.time))).size],
    ["Пробиттів",results.length],
    ["Досягнуто цілі",success],
    ["Хибних пробиттів",falseBreak],
    ["Ціль не досягнута за 24 години",expired],
    ["Не було попередньої цілі",noTarget],
    ["Неоднозначні свічки",ambiguous],
    ["Неповні дані",incomplete],
    ["Оцінені пробиття",evaluated],
    ["Успішність серед оцінених",evaluated?rate.toFixed(1)+"%":"Немає даних"]
  ];
  for(const [name,value] of stats){
    html+='<div class="stat"><span>'+name+'</span><b>'+value+'</b></div>';
  }
  html+='</div>';
  html+='<p class="small">Успішність рахується лише серед пробиттів із визначеною ціллю та однозначним результатом. Один перший пробій на календарний день. Це історичний тест, не гарантія майбутніх угод.</p>';
  html+='<h2>Результати по днях</h2>';
  for(const r of results.slice().reverse()){
    const direction=r.direction==="up"?"Вгору":"Вниз";
    const labels={
      success:"Ціль досягнута",
      false:"Хибне пробиття",
      expired:"Ціль не досягнута за 24 години",
      noTarget:"Немає попередньої локальної цілі",
      ambiguous:"Неоднозначно: ціль і повернення в одній свічці",
      incomplete:"Неповні дані для оцінки"
    };
    const cls=r.status==="success"?"good":
      r.status==="false"?"bad":
      r.status==="ambiguous"?"warn":"";
    html+='<div class="day"><b>'+r.day+' · '+direction+'</b><br>';
    if(r.target!==undefined) html+='Ціль: '+fmt(r.target)+' · ';
    html+='<span class="'+cls+'">'+labels[r.status]+'</span></div>';
  }
  document.getElementById("results").innerHTML=html;
}
document.getElementById("start").addEventListener("click",async()=>{
  const button=document.getElementById("start");
  const status=document.getElementById("status");
  const results=document.getElementById("results");
  button.disabled=true;
  results.innerHTML="";
  try{
    const symbol=document.getElementById("coin").value;
    status.textContent="Завантажую історичні свічки...";
    const candles=await loadCandles(symbol);
    if(candles.length<200) throw new Error("Недостатньо історичних даних.");
    status.textContent="Перевіряю повні дні та аналізую пробиття...";
    const data=analyze(candles);
    showResults(candles,data,symbol);
    status.textContent="Тест завершено. Свічок: "+candles.length;
  }catch(e){
    status.textContent="Помилка: "+e.message;
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
