<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit Historical Test</title>
<style>
body{background:#10151f;color:white;font-family:Arial;padding:16px}
h2{color:#f7a600}
.card{background:#1c2635;padding:14px;margin:12px 0;border-radius:10px}
input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}
button{background:#f7a600;border:0;border-radius:7px;font-weight:bold}
.small{color:#aaa;font-size:13px;line-height:1.5}
.green{color:#36d399}.red{color:#ff6464}.yellow{color:#ffc247}
</style>
</head>
<body>
<h2>BYBIT HISTORICAL TEST</h2>
<p class="small">30 днів · 15-хвилинні свічки · Europe/Prague</p>

<label>Монета:</label>
<input id="symbol" value="BTCUSDT">
<button id="run" onclick="runTest()">Почати тест за 30 днів</button>
<div id="status">Очікування запуску...</div>
<div id="result"></div>

<script>
const API="https://api.bybit.com";
const INTERVAL=15;
const DAY=86400000;
const HOUR=3600000;

function sleep(ms){
 return new Promise(r=>setTimeout(r,ms));
}

function pragueDate(t){
 return new Intl.DateTimeFormat("en-CA",{
  timeZone:"Europe/Prague",
  year:"numeric",month:"2-digit",day:"2-digit"
 }).format(new Date(t));
}

function pragueMidnight(day){
 const [y,m,d]=day.split("-").map(Number);
 let t=Date.UTC(y,m-1,d);
 for(let i=0;i<4;i++){
  const p=new Intl.DateTimeFormat("en-GB",{
   timeZone:"Europe/Prague",
   year:"numeric",month:"2-digit",day:"2-digit",
   hour:"2-digit",minute:"2-digit",second:"2-digit",
   hourCycle:"h23"
  }).formatToParts(new Date(t));
  const o={};
  p.forEach(x=>o[x.type]=x.value);
  const shown=Date.UTC(+o.year,+o.month-1,+o.day,
   +o.hour,+o.minute,+o.second);
  t+=Date.UTC(y,m-1,d)-shown;
 }
 return t;
}

async function getCandles(symbol,start,end){
 let all=[];
 let cursor=start;
 const status=document.getElementById("status");

 while(cursor<end){
  const until=Math.min(end,cursor+1000*INTERVAL*60000);
  const url=API+"/v5/market/kline?category=linear&symbol="+
   encodeURIComponent(symbol)+"&interval=15&start="+
   cursor+"&end="+until+"&limit=1000";

  const response=await fetch(url);
  if(!response.ok)throw Error("HTTP "+response.status);
  const json=await response.json();
  if(json.retCode!==0)throw Error(json.retMsg);

  const rows=json.result.list||[];
  all.push(...rows);

  cursor=until;
  status.textContent="Завантаження історії: "+
   Math.min(100,Math.round((cursor-start)/(end-start)*100))+"%";

  await sleep(150);
 }

 const unique={};
 all.forEach(x=>unique[x[0]]=x);

 return Object.values(unique)
  .map(x=>({
   time:Number(x[0]),
   open:Number(x[1]),
   high:Number(x[2]),
   low:Number(x[3]),
   close:Number(x[4])
  }))
  .filter(x=>x.time>=start&&x.time<end)
  .sort((a,b)=>a.time-b.time);
}

// Підтверджений локальний екстремум:
// дві свічки зліва і дві справа від нього.
// Для сигналу беремо лише екстремуми,
// які вже були підтверджені ДО моменту входу.
function findPreviousTarget(candles,index,direction){
 const from=Math.max(2,index-96);
 const candidates=[];

 for(let p=from;p<=index-3;p++){
  const c=candles[p];
  let pivot=true;

  for(let k=p-2;k<=p+2;k++){
   if(k===p)continue;
   if(direction==="up"&&candles[k].high>=c.high)pivot=false;
   if(direction==="down"&&candles[k].low<=c.low)pivot=false;
  }

  if(!pivot)continue;

  if(direction==="up"&&c.high>candles[index].close)
   candidates.push(c.high);

  if(direction==="down"&&c.low<candles[index].close)
   candidates.push(c.low);
 }

 if(!candidates.length)return null;

 return direction==="up"
  ?Math.min(...candidates)
  :Math.max(...candidates);
}

async function runTest(){
 const button=document.getElementById("run");
 const status=document.getElementById("status");
 const result=document.getElementById("result");
 const symbol=document.getElementById("symbol").value
  .trim().toUpperCase();

 if(!/^[A-Z0-9]+$/.test(symbol)){
  status.textContent="Перевір назву монети.";
  return;
 }

 button.disabled=true;
 result.innerHTML="";

 try{
  const now=Date.now();
  const start=now-31*DAY;
  const candles=await getCandles(symbol,start,now);

  if(candles.length<1000)
   throw Error("Отримано замало історичних свічок.");

  const byDay={};
  candles.forEach((c,i)=>{
   const day=pragueDate(c.time);
   if(!byDay[day])byDay[day]=[];
   byDay[day].push(i);
  });

  const dates=Object.keys(byDay).sort();
  let total=0,success=0,falseBreak=0,noTarget=0,expired=0;
  let details=[];
  const usedDays={};

  for(let d=1;d<dates.length;d++){
   const day=dates[d];
   const previous=byDay[dates[d-1]];
   const current=byDay[day];
   if(!previous.length||!current.length)continue;

   let yesterdayHigh=-Infinity;
   let yesterdayLow=Infinity;

   previous.forEach(i=>{
    yesterdayHigh=Math.max(yesterdayHigh,candles[i].high);
    yesterdayLow=Math.min(yesterdayLow,candles[i].low);
   });

   for(let n=0;n<current.length;n++){
    const i=current[n];
    const c=candles[i];

    let direction=null;
    let level=0;

    // Закриття свічки має бути за вчорашнім рівнем.
    if(c.close>yesterdayHigh){
     direction="up";
     level=yesterdayHigh;
    }else if(c.close<yesterdayLow){
     direction="down";
     level=yesterdayLow;
    }else continue;

    if(usedDays[day])break;
    usedDays[day]=true;
    total++;

    const target=findPreviousTarget(candles,i,direction);

    if(target===null){
     noTarget++;
     details.push({
      day,direction,answer:"Немає попередньої локальної цілі"
     });
     break;
    }

    let answer="Не досягнуто за 24 години";
    let finished=false;
    const deadline=c.time+24*HOUR;

    for(let j=i+1;j<candles.length;j++){
     const next=candles[j];
     if(next.time>deadline)break;

     // Якщо ціна повернулась за рівень пробиття,
     // вважаємо пробиття хибним.
     if(direction==="up"&&next.close<=level){
      answer="Хибне пробиття";
      falseBreak++;
      finished=true;
      break;
     }

     if(direction==="down"&&next.close>=level){
      answer="Хибне пробиття";
      falseBreak++;
      finished=true;
      break;
     }

     // Перевіряємо досягнення цілі.
     if(direction==="up"&&next.high>=target){
      answer="Ціль досягнута";
      success++;
      finished=true;
      break;
     }

     if(direction==="down"&&next.low<=target){
      answer="Ціль досягнута";
      success++;
      finished=true;
      break;
     }
    }

    if(!finished)expired++;

    details.push({
     day,
     direction,
     level,
     target,
     answer
    });

    break;
   }
  }

  const valid=success+falseBreak+expired;
  const accuracy=valid?success/valid*100:0;

  status.textContent="Тест завершено. Свічок: "+
   candles.length+" · Днів: "+dates.length;

  result.innerHTML=`
   <div class="card">
    <h3>${symbol}</h3>
    <p>Завантажено свічок: ${candles.length}</p>
    <p>Днів у даних: ${dates.length}</p>
    <p>Пробиттів: ${total}</p>
    <p class="green">Досягнуто цілі: ${success}</p>
    <p class="red">Хибних пробиттів: ${falseBreak}</p>
    <p class="yellow">Не було попередньої цілі: ${noTarget}</p>
    <p>Ціль не досягнута за 24 години: ${expired}</p>
    <h2>Успішність: ${accuracy.toFixed(1)}%</h2>
    <p class="small">
     Успішність рахується серед пробиттів із визначеною ціллю.
     Це історичний результат, а не гарантія майбутньої угоди.
    </p>
   </div>
   <div class="card">
    <h3>Результати по днях</h3>
    ${details.slice().reverse().map(x=>`
     <p>
      ${x.day} · ${x.direction==="up"?"Вгору":"Вниз"}<br>
      ${x.target?"Ціль: "+x.target+" · ":""}
      ${x.answer}
     </p>
    `).join("")}
   </div>
  `;

 }catch(e){
  status.textContent="Помилка: "+e.message;
 }finally{
  button.disabled=false;
 }
}
</script>
</body>
</html>
