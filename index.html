<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bybit Signals</title>
<style>
body{font-family:Arial,sans-serif;background:#10141d;color:#eee;margin:0;padding:16px}
h1{color:#f0b90b;margin:8px 0}
.info{color:#aaa;font-size:14px;margin:8px 0}
#progress{background:#252c38;border-radius:8px;padding:12px;margin:14px 0}
#bar{height:8px;background:#333;border-radius:8px;overflow:hidden;margin-top:8px}
#fill{height:100%;width:0;background:#f0b90b;transition:width .2s}
.card{background:#1b2230;border-radius:10px;padding:12px;margin:10px 0}
.green{color:#35d07f}.red{color:#ff6262}.yellow{color:#f0b90b}
.small{font-size:13px;color:#aaa}
button{background:#f0b90b;border:0;border-radius:7px;padding:10px 14px;font-weight:bold}
</style>
</head>
<body>
<h1>BYBIT SIGNALS</h1>
<div class="info">Усі USDT Perpetual · Europe/Prague · 15 хв</div>
<div id="status">Підготовка...</div>
<div id="progress">
  <div id="progressText">Завантаження монет...</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<div class="info" id="summary"></div>
<h2>Сигнали</h2>
<div id="signals">Очікування даних...</div>
<h2>Монети біля рівнів</h2>
<div id="coins"></div>
<script>
const API="https://api.bybit.com";
const $=id=>document.getElementById(id);
let symbols=[],prices={},levels={},signals=[];
let busy=false;
const todayKey=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Prague",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());

function pragueMidnight(dateText){
const [y,m,d]=dateText.split(”-”).map(Number);
const target=Date.UTC(y,m-1,d);
let guess=target;
for(let i=0;i<3;i++){
const parts=new Intl.DateTimeFormat(“en-GB”,{
timeZone:“Europe/Prague”,year:“numeric”,month:“2-digit”,
day:“2-digit”,hour:“2-digit”,minute:“2-digit”,second:“2-digit”,
hourCycle:“h23”
}).formatToParts(new Date(guess));
const v={};
parts.forEach(p=>v[p.type]=p.value);
const shown=Date.UTC(+v.year,+v.month-1,+v.day,+v.hour,+v.minute,+v.second);
guess+=target-shown;
}
return guess;
}
async function getJSON(path){
const r=await fetch(API+path);
if(!r.ok)throw new Error(“HTTP “+r.status);
const j=await r.json();
if(j.retCode!==0)throw new Error(j.retMsg||“Bybit API error”);
return j.result;
}
async function loadSymbols(){
let cursor=””,all=[];
do{
let url=”/v5/market/instruments-info?category=linear&limit=1000”;
if(cursor)url+=”&cursor=”+curso
const r=await getJSON(url);
all=all.concat(r.list||[]);
cursor=r.nextPageCursor||””;
}while(cursor);
return all.filter(x=>x.status===“Trading”&&x.quoteCoin===“USDT”&&x.contractType===“LinearPerpetual”).map(x=>x.symbol);
}
async function loadPrices(){
const r=await getJSON(”/v5/market/tickers?category=linear”);
prices={};
(r.list||[]).forEach(x=>{if(x.symbol.endsWith(“USDT”))prices[x.symbol]=Number(x.lastPrice)});
}
async function loadOneLevel(symbol,start,end){
const q=/v5/market/kline?category=linear&symbol=${encodeURIComponent(symbol)}&interval=15&start=${start}&end=${end}&limit=100;
const r=await getJSON(q);
const candles=r.list||[];
if(!candles.length)return null;
let high=-Infinity,low=Infinity;
candles.forEach(c=>{high=Math.max(high,Number(c[2]));low=Math.min(low,Number(c[3]));});
if(!Number.isFinite(high)||!Number.isFinite(low))return null;
return {high,low};
}
async function worker(queue,start,end){
while(queue.length){
const symbol=queue.shift();
try{
const v=await loadOneLevel(symbol,start,end);
if(v)levels[symbol]=v;
}catch(e){}
completed++;
if(completed%5===0||completed===symbols.length)updateProgress();
await new Promise(r=>setTimeout(r,180));
}
}
let completed=0;
function updateProgress(){
const pct=symbols.length?Math.round(completed/symbols.length100):0;
$(“fill”).style.width=pct+”%”;
$(“progressText”).textContent=Рівні завантажено: ${completed} із ${symbols.length} (${pct}%);
$(“summary”).textContent=Монет: ${symbols.length} · Рівнів готово: ${Object.keys(levels).length};
}
function render(){
const sig=signals.slice(-30).reverse();
$(“signals”).innerHTML=sig.length?sig.map(s=> <div class="card"> <b class="${s.side==="LONG"?"green":"red"}">${s.side} — ${s.symbol}</b><br> Ціна пробою: ${s.price}<br> Рівень учора: ${s.level}<br> <span class="small">${s.time}</span> </div>).join(””):”Підтверджених пробоїв поки немає.”;
const near=symbols.filter(s=>levels[s]&&prices[s]).map(s=>{
const p=prices[s],l=levels[s];
const dh=(l.high-p)/p100,dl=(p-l.low)/p*100;
return {s,p,l,dist:Math.min(Math.abs(dh),Math.abs(dl)),dh,dl};
}).filter(x=>x.dist<=1).sort((a,b)=>a.dist-b.dist).slice(0,50);
$(“coins”).innerHTML=near.length?near.map(x=> <div class="card"> <b>${x.s}</b><br> Ціна: ${x.p}<br> Вчорашній максимум: ${x.l.high} · ${x.dh.toFixed(2)}%<br> Вчорашній мінімум: ${x.l.low} · ${x.dl.toFixed(2)}% </div>).join(””):”Монет біля рівнів зараз немає.”;
}
async function checkSignals(){
if(busy)return;
busy=true;
try{
await loadPrices();
const now=Date.now();
const candidates=symbols.filter(s=>levels[s]&&prices[s]);
for(let i=0;i<candidates.length;i+=5){
const batch=candidates.slice(i,i+5);
await Promise.all(batch.map(async symbol=>{
try{
const r=await getJSON(/v5/market/kline?category=linear&symbol=${symbol}&interval=15&limit=3);
const a=(r.list||[]).slice().sort((x,y)=>Number(x[0])-Number(y[0]));
if(a.length<3)return;
const prev=a[a.length-3],last=a[a.length-2];
const prevClose=Number(prev[4]),close=Number(last[4]);
const level=levels[symbol];
let side=””;
if(prevClose<=level.high&&close>level.high)side=“LONG”;
if(prevClose>=level.low&&close<level.low)side=“SHORT”;
if(!side)return;
const key=todayKey()+””+symbol+””+side+”_”+last[0];
if(signals.some(s=>s.key===key))return;
signals.push({key,symbol,side,price:close,level:side===“LONG”?level.high:level.low,
time:new Date(Number(last[0])).toLocaleString(“uk-UA”,{timeZone:“Europe/Prague”})});
localStorage.setItem(“bybitSignals”,JSON.stringify(signals.slice(-200)));
}catch(e){}
}));
await new Promise(r=>setTimeout(r,150));
}
render();
$(“status”).textContent=“Оновлено: “+new Date().toLocaleTimeString(“uk-UA”,{timeZone:“Europe/Prague”});
}catch(e){
$(“status”).textContent=“Помилка оновлення цін: “+e.message;
}finally{busy=false;}
}
async function start(){
try{
signals=JSON.parse(localStorage.getItem(“bybitSignals”)||”[]”);
$(“status”).textContent=“Завантаження списку монет…”;
symbols=await loadSymbols();
$(“summary”).textContent=“Знайдено монет: “+symbols.length;
await loadPrices();
render();
const today=todayKey();
const yesterday=new Date(pragueMidnight(today)-86400000);
const yText=new Intl.DateTimeFormat(“en-CA”,{timeZone:“Europe/Prague”,year:“numeric”,month:“2-digit”,day:“2-digit”}).format(yesterday);
const start=pragueMidnight(yText);
const end=pragueMidnight(today)-1;
completed=0;
$(“status”).textContent=“Монети завантажені. Завантажую вчорашні рівні…”;
const queue=symbols.slice();
await Promise.all(Array.from({length:3},()=>worker(queue,start,end)));
updateProgress();
render();
$(“status”).textContent=“Усі рівні завантажені. Сканування активне.”;
await checkSignals();
setInterval(checkSignals,60000);
setInterval(async()=>{try{await loadPrices();render();}catch(e){}},30000);
}catch(e){
$(“status”).textContent=“Помилка: “+e.message+” · Онови сторінку пізніше.”;
$(“progressText”).textContent=“Не вдалося завершити завантаження.”;
}
}
start();
</body>
</html>
