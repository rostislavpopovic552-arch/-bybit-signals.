const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function signalIsFresh(s) {
  const timestamp = Number(s && s.candleTime);

  return Number.isFinite(timestamp) &&
    timestamp > 0 &&
    Date.now() - timestamp <= MAX_SIGNAL_AGE_MS &&
    Date.now() >= timestamp;
}

function validSignal(s) {
  return s &&
    typeof s.symbol === "string" &&
    (s.side === "LONG" || s.side === "SHORT") &&
    Number.isFinite(Number(s.price)) &&
    Number.isFinite(Number(s.target)) &&
    Number.isFinite(Number(s.tp)) &&
    Number.isFinite(Number(s.sl)) &&
    Number(s.price) > 0 &&
    Number(s.tp) > 0 &&
    Number(s.sl) > 0 &&
    Number(s.target) > 0 &&
    Number(s.profitPercent) >= MIN_PROFIT_PERCENT &&
    signalIsFresh(s);
}

function todayKey() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Prague",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

function pragueMidnight(dateText) {
  const [y,m,d] = dateText.split("-").map(Number);
  const target = Date.UTC(y,m-1,d);
  let guess = target;

  for (let i=0;i<3;i++) {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone:"Europe/Prague",
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }).formatToParts(new Date(guess));

    const v = {};
    parts.forEach(p => v[p.type]=p.value);

    const shown = Date.UTC(
      Number(v.year),
      Number(v.month)-1,
      Number(v.day),
      Number(v.hour),
      Number(v.minute),
      Number(v.second)
    );

    guess += target-shown;
  }

  return guess;
}

async function getJSON(path) {
  const response = await fetch(API + path);

  if (!response.ok) {
    throw new Error("HTTP " + response.status);
  }

  const json = await response.json();

  if (json.retCode !== 0) {
    throw new Error(json.retMsg || "Помилка Bybit");
  }

  return json.result;
}

function isCryptoContract(x) {
  const base = String(x.baseCoin || "").toUpperCase();
  const symbol = String(x.symbol || "").toUpperCase();

  const isForex =
    /^(EUR|GBP|USD|JPY|AUD|NZD|CAD|CHF){2}$/.test(base);

  const isStock = base.includes("STOCK");

  return x.status === "Trading" &&
    x.quoteCoin === "USDT" &&
    x.contractType === "LinearPerpetual" &&
    symbol === base + "USDT" &&
    !STABLECOINS.has(base) &&
    !NON_CRYPTO.has(base) &&
    !isForex &&
    !isStock;
}

async function loadSymbols() {
  let cursor = "";
  const all = [];

  do {
    let url =
      "/v5/market/instruments-info?category=linear&limit=1000";

    if (cursor) {
      url += "&cursor=" + encodeURIComponent(cursor);
    }

    const result = await getJSON(url);

    all.push(...(result.list || []));
    cursor = result.nextPageCursor || "";

    $("status").textContent =
      "Знайдено контрактів: " + all.length;

  } while (cursor);

  return all.filter(isCryptoContract).map(x => x.symbol);
}

async function loadPrices() {
  const result = await getJSON(
    "/v5/market/tickers?category=linear"
  );

  prices = {};

  (result.list || []).forEach(x => {
    if (symbols.includes(x.symbol)) {
      prices[x.symbol] = Number(x.lastPrice);
    }
  });
}

async function loadOneLevel(symbol,startTime,endTime) {
  const url =
    "/v5/market/kline?category=linear" +
    "&symbol=" + encodeURIComponent(symbol) +
    "&interval=15&start=" + startTime +
    "&end=" + endTime +
    "&limit=100";

  const result = await getJSON(url);
  const candles = result.list || [];

  if (!candles.length) return null;

  let high = -Infinity;
  let low = Infinity;

  candles.forEach(c => {
    high = Math.max(high,Number(c[2]));
    low = Math.min(low,Number(c[3]));
  });

  if (!Number.isFinite(high) || !Number.isFinite(low)) {
    return null;
  }

  return {high,low};
}

function updateProgress() {
  const percent = symbols.length
    ? Math.round(completed/symbols.length*100)
    : 0;

  $("fill").style.width = percent + "%";

  $("progressText").textContent =
    "Рівнів завантажено: " + completed +
    " із " + symbols.length + " (" + percent + "%)";

  $("summary").textContent =
    "Криптовалют: " + symbols.length +
    " · Рівнів готово: " + Object.keys(levels).length;
}

async function worker(queue,startTime,endTime) {
  while (queue.length) {
    const symbol = queue.shift();

    try {
      const level = await loadOneLevel(
        symbol,startTime,endTime
      );

      if (level) levels[symbol] = level;

    } catch(error) {}

    completed++;
    updateProgress();

    await sleep(250);
  }
}

async function calculateTradeLevels(symbol,side,entry) {
  const url =
    "/v5/market/kline?category=linear" +
    "&symbol=" + encodeURIComponent(symbol) +
    "&interval=15&limit=100";

  const result = await getJSON(url);

  const candles = (result.list || [])
    .slice()
    .sort((a,b) => Number(a[0])-Number(b[0]));

  const closed = candles.slice(0,-1);

  if (closed.length < 10) return null;

  const now = Date.now();

  const last24h = closed.filter(c =>
    Number(c[0]) >= now - 24*60*60*1000
  );

  if (last24h.length < 10) return null;

  const highs = [];
  const lows = [];

  for (let i=2; i<last24h.length-2; i++) {
    const h = Number(last24h[i][2]);
    const l = Number(last24h[i][3]);

    const prevHighs = [
      Number(last24h[i-2][2]),
      Number(last24h[i-1][2])
    ];

    const nextHighs = [
      Number(last24h[i+1][2]),
      Number(last24h[i+2][2])
    ];

    const prevLows = [
      Number(last24h[i-2][3]),
      Number(last24h[i-1][3])
    ];

    const nextLows = [
      Number(last24h[i+1][3]),
      Number(last24h[i+2][3])
    ];

    if (
      prevHighs.every(v => h > v) &&
      nextHighs.every(v => h >= v)
    ) {
      highs.push(h);
    }

    if (
      prevLows.every(v => l < v) &&
      nextLows.every(v => l <= v)
    ) {
      lows.push(l);
    }
  }

  let target = 0;
  let tp = 0;
  let sl = 0;

  if (side === "LONG") {
    const candidates = highs
      .filter(h => h > entry)
      .sort((a,b) => a-b);

    if (!candidates.length) return null;

    target = candidates[0];
    tp = target * (1 - TP_OFFSET);

    if (tp <= entry) return null;

    const risk = (tp-entry)/SL_RATIO;
    sl = entry-risk;

  } else {
    const candidates = lows
      .filter(l => l < entry)
      .sort((a,b) => b-a);

    if (!candidates.length) return null;

    target = candidates[0];
    tp = target * (1 + TP_OFFSET);

    if (tp >= entry) return null;

    const risk = (entry-tp)/SL_RATIO;
    sl = entry+risk;
  }

  if (![entry,tp,sl,target].every(Number.isFinite)) {
    return null;
  }

  if (entry <= 0 || tp <= 0 || sl <= 0 || target <= 0) {
    return null;
  }

  return {entry,tp,sl,target};
}

function render() {
  signals = signals.filter(validSignal);

  $("signals").innerHTML = signals.length
    ? signals.slice(-30).reverse().map(s => `
      <div class="card">
        <b class="${s.side==="LONG"?"green":"red"}">
          ${s.side} — ${s.symbol}
        </b><br>
        Ціна входу: ${Number(s.price)}<br>
        Локальний рівень: ${Number(s.target)}<br>
        <span class="green">
          Take Profit: ${Number(s.tp)}
        </span><br>
        <span class="red">
          Stop Loss: ${Number(s.sl)}
        </span><br>
        Потенційний прибуток: ${s.profitPercent}%<br>
        Потенційний ризик: ${s.riskPercent}%<br>
        Співвідношення прибуток/ризик: 3:1<br>
        <span class="small">${s.time || ""}</span>
      </div>
    `).join("")
    : "<div class='info'>Актуальних сигналів із прибутком від 0,30% поки немає.</div>";

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(signals)
  );

  const near = symbols
    .filter(s => levels[s] && prices[s] > 0)
    .map(s => {
      const price = prices[s];
      const level = levels[s];

      const dh = (level.high-price)/price*100;
      const dl = (price-level.low)/price*100;

      return {
        symbol:s,
        price,
        level,
        dh,
        dl,
        dist:Math.min(Math.abs(dh),Math.abs(dl))
      };
    })
    .filter(x => x.dist <= 1)
    .sort((a,b) => a.dist-b.dist)
    .slice(0,50);

  $("coins").innerHTML = near.length
    ? near.map(x => `
      <div class="card">
        <b>${x.symbol}</b><br>
        Ціна: ${x.price}<br>
        Вчорашній максимум: ${x.level.high} · ${x.dh.toFixed(2)}%<br>
        Вчорашній мінімум: ${x.level.low} · ${x.dl.toFixed(2)}%
      </div>
    `).join("")
    : "<div class='info'>Монет біля рівнів зараз немає.</div>";
}

    renderTimer = null;

    s.side === side &&
    Date.now()-Number(s.candleTime) < MAX_SIGNAL_AGE_MS
  );
}
