<script>
"use strict";

const API = "https://api.bybit.com";
const $ = id => document.getElementById(id);

const SIGNAL_MAX_AGE_MS = 5 * 60 * 1000;
const MAX_DAILY_TRADES = 3;
const MAX_DAILY_LOSSES = 2;
const MAX_RISK_PERCENT = 0.5;
const SCAN_BATCH_SIZE = 4;

let running = false;
let busy = false;
let timer = null;

let symbols = [];
let signals = [];
let trades = [];

let state = {};
let processed = new Set();

let dayKey = "";
let dailyTrades = 0;
let losses = 0;

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function readStorage(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (e) {
    console.warn("Помилка читання сховища:", key, e);
    return fallback;
  }
}

function pragueDay(date = new Date()) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Prague",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);

  const v = {};

  parts.forEach(p => {
    v[p.type] = p.value;
  });

  return `${v.year}-${v.month}-${v.day}`;
}

function loadState() {
  trades = readStorage("paperTrades", []);
  state = readStorage("paperState", {});

  if (!Array.isArray(trades)) {
    trades = [];
  }

  trades = trades.filter(t =>
    t && typeof t === "object"
  );

  if (!state || typeof state !== "object") {
    state = {};
  }

  processed = new Set(
    Array.isArray(state.processed)
      ? state.processed
      : []
  );

  dayKey = pragueDay();

  const seen = new Set();

  trades = trades.filter(t => {
    const key = t.id ||
      `${t.symbol}-${t.side}-${t.opened}-${t.entry}`;

    if (seen.has(key)) return false;

    seen.add(key);
    return true;
  });

  for (const t of trades) {
    if (t.id) {
      processed.add(t.id);
    }
  }

  dailyTrades = trades.filter(t =>
    t.opened &&
    pragueDay(new Date(t.opened)) === dayKey
  ).length;

  losses = countTodayLosses();

  save();
}

function save() {
  try {
    localStorage.setItem(
      "paperTrades",
      JSON.stringify(trades)
    );

    localStorage.setItem(
      "paperState",
      JSON.stringify({
        day: dayKey,
        dailyTrades,
        losses,
        processed: [...processed].slice(-1000)
      })
    );
  } catch (e) {
    console.error("Не вдалося зберегти журнал:", e);
  }
}

function countTodayLosses() {
  const closed = trades
    .filter(t =>
      t.status === "CLOSED" &&
      t.closed &&
      pragueDay(new Date(t.closed)) === dayKey
    )
    .sort((a, b) =>
      Number(b.closed) - Number(a.closed)
    );

  let count = 0;

  for (const t of closed) {
    if (Number(t.realized) < 0) {
      count++;
    } else {
      break;
    }
  }

  return count;
}

function resetDay() {
  const today = pragueDay();

  if (today !== dayKey) {
    dayKey = today;

    dailyTrades = trades.filter(t =>
      t.opened &&
      pragueDay(new Date(t.opened)) === dayKey
    ).length;

    losses = countTodayLosses();

    save();
  }
}

async function api(path, attempt = 0) {
  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    15000
  );

  let response;

  try {
    response = await fetch(API + path, {
      signal: controller.signal
    });
  } catch (e) {
    clearTimeout(timeout);

    if (attempt < 2) {
      await delay(1000 * (attempt + 1));
      return api(path, attempt + 1);
    }

    throw Error(
      e.name === "AbortError"
        ? "Час очікування Bybit вичерпано"
        : "Немає з'єднання з Bybit"
    );
  }

  clearTimeout(timeout);

  if (
    (response.status === 429 ||
      response.status === 403) &&
    attempt < 3
  ) {
    await delay(1500 * (attempt + 1));
    return api(path, attempt + 1);
  }

  if (!response.ok) {
    throw Error("Помилка Bybit: " + response.status);
  }

  const json = await response.json();

  if (json.retCode !== 0) {
    if (
      json.retCode === 10006 &&
      attempt < 3
    ) {
      await delay(1500 * (attempt + 1));
      return api(path, attempt + 1);
    }

    throw Error(
      json.retMsg || "Помилка API Bybit"
    );
  }

  return json.result;
}

async function loadSymbols() {
  let cursor = "";
  const all = new Set();

  for (let page = 0; page < 10; page++) {
    let path =
      "/v5/market/instruments-info" +
      "?category=linear" +
      "&limit=1000" +
      "&settleCoin=USDT";

    if (cursor) {
      path += "&cursor=" + encodeURIComponent(cursor);
    }

    const result = await api(path);

    if (!result || !Array.isArray(result.list)) {
      break;
    }

    for (const x of result.list) {
      if (
        x.status === "Trading" &&
        x.contractType === "LinearPerpetual" &&
        x.symbol.endsWith("USDT")
      ) {
        all.add(x.symbol);
      }
    }

    cursor = result.nextPageCursor || "";

    if (!cursor) {
      break;
    }
  }

  return [...all];
}

async function tickerMap() {
  const result = await api(
    "/v5/market/tickers?category=linear"
  );

  if (!result || !Array.isArray(result.list)) {
    throw Error("Bybit не повернув список цін");
  }

  return Object.fromEntries(
    result.list.map(x => [x.symbol, x])
  );
}

async function candles(symbol) {
  const result = await api(
    "/v5/market/kline" +
    "?category=linear" +
    "&symbol=" + encodeURIComponent(symbol) +
    "&interval=5" +
    "&limit=60"
  );

  if (!result || !Array.isArray(result.list)) {
    return [];
  }

  return result.list.map(x => ({
    time: Number(x[0]),
    open: Number(x[1]),
    high: Number(x[2]),
    low: Number(x[3]),
    close: Number(x[4])
  })).reverse().filter(x =>
    Number.isFinite(x.time) &&
    Number.isFinite(x.open) &&
    Number.isFinite(x.high) &&
    Number.isFinite(x.low) &&
    Number.isFinite(x.close)
  );
}

function setupIsFresh(setup) {
  const closeTime =
    Number(setup.time) + 5 * 60 * 1000;

  const age = Date.now() - closeTime;

  return Number.isFinite(closeTime) &&
    age >= 0 &&
    age <= SIGNAL_MAX_AGE_MS;
}

function signalId(symbol, setup) {
  return [
    symbol,
    setup.side,
    setup.sweepTime,
    Number(setup.level).toFixed(10)
  ].join("-");
}

function legacySignalId(symbol, setup) {
  return `${symbol}-${setup.side}-${setup.time}`;
}

function signalWasUsed(symbol, setup) {
  const id = signalId(symbol, setup);
  const oldId = legacySignalId(symbol, setup);

  if (
    processed.has(id) ||
    processed.has(oldId)
  ) {
    return true;
  }

  return trades.some(t =>
    t.id === id ||
    t.id === oldId ||
    (
      t.symbol === symbol &&
      t.side === setup.side &&
      Number(t.sweepTime) === Number(setup.sweepTime)
    )
  );
}

/*
  Sweep → BOS → Retest.
  Аналізуються лише закриті M5-свічки.
*/

function findSetup(candleList) {
  const a = candleList.slice(0, -1);

  if (a.length < 20) {
    return null;
  }

  const last = a.length - 1;
  const retest = a[last];

  const closeTime =
    retest.time + 5 * 60 * 1000;

  const age = Date.now() - closeTime;

  if (
    age < 0 ||
    age > SIGNAL_MAX_AGE_MS
  ) {
    return null;
  }

  for (
    let i = last - 2;
    i >= Math.max(10, last - 10);
    i--
  ) {
    const previous = a.slice(i - 10, i);

    if (previous.length !== 10) {
      continue;
    }

    const support = Math.min(
      ...previous.map(x => x.low)
    );

    const resistance = Math.max(
      ...previous.map(x => x.high)
    );

    const sweep = a[i];

    // LONG: збір ліквідності знизу.
    if (
      sweep.low < support &&
      sweep.close > support
    ) {
      const level = resistance;

      let bos = false;

      for (let j = i + 1; j < last; j++) {
        if (a[j].close > level) {
          bos = true;
          break;
        }
      }

      if (
        bos &&
        retest.low <= level * 1.002 &&
        retest.close > level &&
        retest.close > retest.open
      ) {
        return {
          side: "LONG",
          level,
          sl: sweep.low * 0.999,
          time: retest.time,
          sweepTime: sweep.time,
          retestClose: retest.close,
          reason: "Sweep → BOS → Retest"
        };
      }
    }

    // SHORT: збір ліквідності зверху.
    if (
      sweep.high > resistance &&
      sweep.close < resistance
    ) {
      const level = support;

      let bos = false;

      for (let j = i + 1; j < last; j++) {
        if (a[j].close < level) {
          bos = true;
          break;
        }
      }

      if (
        bos &&
        retest.high >= level * 0.998 &&
        retest.close < level &&
        retest.close < retest.open
      ) {
        return {
          side: "SHORT",
          level,
          sl: sweep.high * 1.001,
          time: retest.time,
          sweepTime: sweep.time,
          retestClose: retest.close,
          reason: "Sweep → BOS → Retest"
        };
      }
    }
  }

  return null;
}

function fmt(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "—";
  }

  return n.toLocaleString("en-US", {
    maximumFractionDigits: 6
  });
}

function openPaper(symbol, setup, price) {
  resetDay();

  if (!setupIsFresh(setup)) return false;

  if (signalWasUsed(symbol, setup)) {
    return false;
  }

  if (losses >= MAX_DAILY_LOSSES) {
    return false;
  }

  if (dailyTrades >= MAX_DAILY_TRADES) {
    return false;
  }

  if (trades.some(t =>
    t.symbol === symbol &&
    t.status === "OPEN"
  )) {
    return false;
  }

  price = Number(price);

  if (
    !Number.isFinite(price) ||
    price <= 0
  ) {
    return false;
  }

  const level = Number(setup.level);
  const sl = Number(setup.sl);

  if (
    !Number.isFinite(level) ||
    !Number.isFinite(sl)
  ) {
    return false;
  }

  const distance = Math.abs(price - sl);

  if (
    !Number.isFinite(distance) ||
    distance <= 0
  ) {
    return false;
  }

  if (distance / price > 0.025) {
    return false;
  }

  // LONG має відкриватися вище рівня пробою.
  if (
    setup.side === "LONG" &&
    price <= level
  ) {
    return false;
  }

  // SHORT має відкриватися нижче рівня пробою.
  if (
    setup.side === "SHORT" &&
    price >= level
  ) {
    return false;
  }

  if (
    Math.abs(price - level) / price > 0.003
  ) {
    return false;
  }

  if (
    setup.retestClose &&
    Math.abs(price - setup.retestClose) / price > 0.005
  ) {
    return false;
  }

  if (
    setup.side === "LONG" &&
    price <= sl
  ) {
    return false;
  }

  if (
    setup.side === "SHORT" &&
    price >= sl
  ) {
    return false;
  }

  const deposit = Math.max(
    1,
    Number($("deposit")?.value) || 1000
  );

  const riskInput =
    Number($("risk")?.value);

  const risk = Math.min(
    MAX_RISK_PERCENT,
    Math.max(
      0.01,
      Number.isFinite(riskInput) && riskInput > 0
        ? riskInput
        : MAX_RISK_PERCENT
    )
  );

  const riskMoney =
    deposit * risk / 100;

  const qty =
    riskMoney / distance;

  if (
    !Number.isFinite(qty) ||
    qty <= 0
  ) {
    return false;
  }

  const direction =
    setup.side === "LONG" ? 1 : -1;

  const id = signalId(symbol, setup);

  const trade = {
    id,
    symbol,
    side: setup.side,
    entry: price,
    sl,
    level,
    sweepTime: setup.sweepTime,
    qty,
    initialQty: qty,
    tp1: price + direction * distance,
    tp2: price + direction * distance * 2,
    tp3: price + direction * distance * 3,
    r: distance,
    realized: 0,
    status: "OPEN",
    opened: Date.now(),
    hit1: false,
    hit2: false
  };

  trades.unshift(trade);

  processed.add(id);
  processed.add(legacySignalId(symbol, setup));

  dailyTrades++;

  save();

  return true;
}

function closeQty(t, price, qty) {
  const q = Math.min(t.qty, qty);

  if (
    !Number.isFinite(q) ||
    q <= 0
  ) {
    return;
  }

  const direction =
    t.side === "LONG" ? 1 : -1;

  t.realized +=
    (price - t.entry) * direction * q;

  t.qty -= q;

  if (t.qty < t.initialQty * 0.000001) {
    t.qty = 0;
  }
}

function finish(t, price) {
  if (t.status !== "OPEN") {
    return;
  }

  if (t.qty > 0) {
    closeQty(t, price, t.qty);
  }

  t.status = "CLOSED";
  t.closed = Date.now();

  losses = countTodayLosses();

  save();
}

function updateTrades(prices) {
  resetDay();

  for (const t of trades) {
    if (t.status !== "OPEN") {
      continue;
    }

    const price = Number(prices[t.symbol]);

    if (
      !Number.isFinite(price) ||
      price <= 0
    ) {
      continue;
    }

    const third = t.initialQty / 3;

    if (t.side === "LONG") {
      // SL перевіряється першим.
      if (price <= t.sl) {
        finish(t, t.sl);
        continue;
      }

      if (!t.hit1 && price >= t.tp1) {
        closeQty(t, t.tp1, third);
        t.hit1 = true;
      }

      if (!t.hit2 && price >= t.tp2) {
        closeQty(t, t.tp2, third);
        t.hit2 = true;
      }

      if (price >= t.tp3) {
        finish(t, t.tp3);
      }

    } else {
      if (price >= t.sl) {
        finish(t, t.sl);
        continue;
      }

      if (!t.hit1 && price <= t.tp1) {
        closeQty(t, t.tp1, third);
        t.hit1 = true;
      }

      if (!t.hit2 && price <= t.tp2) {
        closeQty(t, t.tp2, third);
        t.hit2 = true;
      }

      if (price <= t.tp3) {
        finish(t, t.tp3);
      }
    }
  }

  save();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function render() {
  const pairsEl = $("pairs");
  const signalCountEl = $("signalCount");
  const openCountEl = $("openCount");
  const closedCountEl = $("closedCount");

  if (pairsEl) {
    pairsEl.textContent = symbols.length;
  }

  if (signalCountEl) {
    signalCountEl.textContent = signals.length;
  }

  if (openCountEl) {
    openCountEl.textContent =
      trades.filter(t => t.status === "OPEN").length;
  }

  if (closedCountEl) {
    closedCountEl.textContent =
      trades.filter(t => t.status === "CLOSED").length;
  }

  const signalsEl = $("signals");

  if (signalsEl) {
    signalsEl.innerHTML = signals.length
      ? `<table>
          <thead>
            <tr>
              <th>Пара</th>
              <th>Напрямок</th>
              <th>Вхід</th>
              <th>SL</th>
              <th>Причина</th>
            </tr>
          </thead>
          <tbody>
            ${signals.map(s => `
              <tr>
                <td>${escapeHTML(s.symbol)}</td>
                <td class="${s.side.toLowerCase()}">
                  ${escapeHTML(s.side)}
                </td>
                <td>${fmt(s.entry)}</td>
                <td>${fmt(s.sl)}</td>
                <td>${escapeHTML(s.reason)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`
      : "Актуальних сигналів поки немає.";
  }

  const tradesEl = $("trades");

  if (tradesEl) {
    const recent = trades.slice(0, 30);

    tradesEl.innerHTML = recent.length
      ? `<table>
          <thead>
            <tr>
              <th>Пара</th>
              <th>Напрямок</th>
              <th>Вхід</th>
              <th>SL</th>
              <th>TP1</th>
              <th>TP2</th>
              <th>TP3</th>
              <th>Статус</th>
              <th>P/L $</th>
            </tr>
          </thead>
          <tbody>
            ${recent.map(t => `
              <tr>
                <td>${escapeHTML(t.symbol)}</td>
                <td class="${t.side.toLowerCase()}">
                  ${escapeHTML(t.side)}
                </td>
                <td>${fmt(t.entry)}</td>
                <td>${fmt(t.sl)}</td>
                <td>${fmt(t.tp1)}</td>
                <td>${fmt(t.tp2)}</td>
                <td>${fmt(t.tp3)}</td>
                <td>${escapeHTML(t.status)}</td>
                <td>${Number(t.realized || 0).toFixed(2)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`
      : "Угод ще немає.";
  }

  const riskEl = $("riskStatus");

  if (riskEl) {
    riskEl.textContent =
      "Угод сьогодні: " + dailyTrades +
      ". Збитків поспіль: " + losses +
      ". " +
      (
        losses >= MAX_DAILY_LOSSES
          ? "Зупинка після двох збитків."
          : "Денний ліміт активний."
      );
  }
}

async function scan() {
  if (busy || !running) {
    return;
  }

  busy = true;

  const status = $("status");

  if (status) {
    status.textContent = "● Сканування ринку...";
  }

  try {
    resetDay();

    if (!symbols.length) {
      symbols = await loadSymbols();
    }

    if (!running) {
      return;
    }

    const tickers = await tickerMap();

    const ranked = symbols
      .filter(s => tickers[s])
      .sort((a, b) =>
        Number(tickers[b].turnover24h || 0) -
        Number(tickers[a].turnover24h || 0)
      );

    // Оновлюємо вже відкриті віртуальні угоди.
    const prices = {};

    for (const t of trades) {
      if (t.status !== "OPEN") {
        continue;
      }

      const ticker = tickers[t.symbol];

      if (ticker) {
        prices[t.symbol] = Number(ticker.lastPrice);
      }
    }

    updateTrades(prices);

    const found = [];

    // Скануємо всі активні USDT perpetual-пари.
    for (
      let i = 0;
      i < ranked.length;
      i += SCAN_BATCH_SIZE
    ) {
      if (!running) {
        break;
      }

      const batch = ranked.slice(
        i,
        i + SCAN_BATCH_SIZE
      );

      const results = await Promise.all(
        batch.map(async symbol => {
          try {
            const data = await candles(symbol);
            const setup = findSetup(data);

            if (!setup) {
              return null;
            }

            return {
              symbol,
              ...setup
            };

          } catch (e) {
            console.warn(
              "Помилка свічок:",
              symbol,
              e
            );

            return null;
          }
        })
      );

      found.push(
        ...results.filter(Boolean)
      );
    }

    if (!running) {
      return;
    }

    // Оновлюємо ціну після анування — перевіряємо знайдені сигнали.
    signals = [];

    for (const item of found) {
      const price = Number(
        tickers[item.symbol]?.lastPrice
      );

      if (!Number.isFinite(price) || price <= 0) {
        continue;
      }

      if (!setupIsFresh(item)) {
        continue;
      }

      if (signalWasUsed(item.symbol, item)) {
        continue;
      }

      signals.push({
        symbol: item.symbol,
        side: item.side,
        entry: price,
        sl: item.sl,
        level: item.level,
        reason: item.reason
      });

      openPaper(item.symbol, item, price);
    }

    render();

    if (status) {
      status.textContent =
        "● Сканування завершено. Перевірено пар: " +
        ranked.length +
        ". Знайдено сигналів: " +
        signals.length;
    }

  } catch (e) {
    console.error("Помилка сканера:", e);

    if (status) {
      status.textContent =
        "Помилка: " + (e.message || "Невідома помилка");
    }

  } finally {
    busy = false;
    render();
  }
}

function startScanner() {
  if (running) return;

  running = true;

  const status = $("status");

  if (status) {
    status.textContent = "● Запуск сканера...";
  }

  scan();

  const intervalInput =
    Number($("interval")?.value) || 60;

  const intervalMs = Math.max(
    15000,
    Math.min(3600000, intervalInput * 1000)
  );

  timer = setInterval(() => {
    scan();
  }, intervalMs);
}

function stopScanner() {
  running = false;

  if (timer) {
    clearInterval(timer);
    timer = null;
  }

  const status = $("status");

  if (status) {
    status.textContent = "Сканер зупинено.";
  }
}

function resetJournal() {
  if (running) {
    stopScanner();
  }

  trades = [];
  signals = [];
  processed.clear();

  dailyTrades = 0;
  losses = 0;
  dayKey = pragueDay();

  save();
  render();

  const status = $("status");

  if (status) {
    status.textContent = "Журнал очищено.";
  }
}

function connectButtons() {
  const startIds = [
    "startBtn",
    "start",
    "startScanner",
    "scanBtn"
  ];

  const stopIds = [
    "stopBtn",
    "stop",
    "stopScanner"
  ];

  const resetIds = [
    "resetBtn",
    "reset",
    "resetJournal"
  ];

  function connect(ids, action) {
    for (const id of ids) {
      const button = $(id);

      if (button && !button.dataset.connected) {
        button.addEventListener("click", action);
        button.dataset.connected = "true";
      }
    }
  }

  connect(startIds, startScanner);
  connect(stopIds, stopScanner);
  connect(resetIds, resetJournal);

  // Додатковий пошук кнопок за їхнім написом.
  document.querySelectorAll("button").forEach(button => {
    if (button.dataset.connected) return;

    const text = button.textContent
      .trim()
      .toLowerCase();

    if (text.includes("запустити сканер")) {
      button.addEventListener("click", startScanner);
      button.dataset.connected = "true";

    } else if (text.includes("зупинити")) {
      button.addEventListener("click", stopScanner);
      button.dataset.connected = "true";

    } else if (text.includes("скинути журнал")) {
      button.addEventListener("click", resetJournal);
      button.dataset.connected = "true";
    }
  });
}

function init() {
  try {
    loadState();
    render();
    connectButtons();

    console.log("ПРИХОВАНИЙ РОЗВОРОТ PRO завантажено.");

  } catch (e) {
    console.error("Помилка запуску:", e);

    const status = $("status");

    if (status) {
      status.textContent =
        "Помилка запуску: " + e.message;
    }
  }
}

// Дозволяємо запускати функції також через HTML.
window.startScanner = startScanner;
window.stopScanner = stopScanner;
window.resetJournal = resetJournal;
window.scan = scan;

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

</script>
