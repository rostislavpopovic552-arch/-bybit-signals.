<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bybit Signals</title>
<style>
body{background:#10151f;color:white;font-family:Arial;padding:16px}
h2{color:#f7a600}
.card{background:#1c2635;padding:14px;margin:10px 0;border-radius:10px}
.green{color:#36d399}.red{color:#ff6464}.yellow{color:#ffc247}
input{width:100%;padding:12px;box-sizing:border-box;margin:12px 0}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<h2>BYBIT SIGNALS</h2>
<div class="small">USDT Perpetual · Europe/Prague · Поріг 0.2%</div>
<div id="status">Завантаження...</div>
<input id="search" placeholder="Пошук монети..." oninput="render()">
<div id="list"></div>

<script>
const API="https://api.bybit.com";
const LIMIT=0.2;
let coins=[];
let cacheDay="";
let loading=false;
let lastTouchScan=0;
let touched={};

function pragueDate(date=new Date()){
 return new Intl.DateTimeFormat("en-CA",{
  timeZone:"Europe/Prague",
  year:"numeric",month:"2-digit",day:"2-digit"
 }).format(date);
}

function pragueMidnightUTC(day){
 const [y,m,d]=day.split("-").map(Number);
 let guess=Date.UTC(y,m-1,d);
 for(let i=0;i<4;i++){
  const parts=new Intl.DateTimeFormat("en-GB",{
   timeZone:"Europe/Prague",
   year:"numeric",month:"2-digit",day:"2-digit",
   hour:"2-digit",minute:"2-digit",second:"2-digit",
   hourCycle:"h23"
  }).formatToParts(new Date(guess));
  const p={};
  parts.forEach(x=>p[x.type]=x.value);
  const shown=Date.UTC(+p.year,+p.month-1,+p.day,
   +p.hour,+p.minute,+p.second);
  guess+=Date.UTC(y,m-1,d)-shown;
 }
 return guess;
}

async function get(path){
 const r=await fetch(API+path);
 if(!r.ok)throw Error("HTTP "+r.status);
 const j=await r.json();
 if(j.retCode!==0)throw Error(j.retMsg);
 return j.result;
}

function loadTouched(day){
 try{
  const saved=JSON.parse(localStorage.getItem("touched_"+day)||"{}");
  touched=saved;
 }catch(e){touched={};}
}

function saveTouched(day){
 localStorage.setItem("touched_"+day,JSON.stringify(touched));
}

async function scanTouches(today){
 const start=pragueMidnightUTC(today);
 const end=Date.now();

 for(let i=0;i<coins.length;i+=8){
  const batch=coins.slice(i,i+8);
  await Promise.all(batch.map(async c=>{
   if(touched[c.symbol])return;
   try{
    const k=await get("/v5/market/kline?category=linear&symbol="+
     c.symbol+"&interval=15&start="+start+"&end="+end+"&limit=200");
    const hit=k.list.some(x=>
     Number(x[2])>=c.high || Number(x[3])<=c.low
    );
    if(hit)touched[c.symbol]=true;
   }catch(e){}
  }));
 }
 saveTouched(today);
 lastTouchScan=Date.now();
}

async function load(){
 if(loading)return;
 loading=true;
 try{
  const today=pragueDate();
  const yesterday=pragueDate(
   new Date(pragueMidnightUTC(today)-86400000)
  );

  if(cacheDay!==yesterday){
   coins=[];
   cacheDay=yesterday;
   touched={};
   loadTouched(today);
   lastTouchScan=0;

   const start=pragueMidnightUTC(yesterday);
   const end=pragueMidnightUTC(today);
   const instruments=await get(
    "/v5/market/instruments-info?category=linear&limit=1000"
   );
   const symbols=instruments.list
    .filter(x=>x.status==="Trading"&&x.symbol.endsWith("USDT"))
    .map(x=>x.symbol);

   for(let i=0;i<symbols.length;i+=8){
    const batch=symbols.slice(i,i+8);
    const rows=await Promise.all(batch.map(async symbol=>{
     try{
      const k=await get("/v5/market/kline?category=linear&symbol="+
       symbol+"&interval=15&start="+start+"&end="+(end-1)+"&limit=200");
      if(!k.list.length)return null;
      return {
       symbol,
       high:Math.max(...k.list.map(x=>Number(x[2]))),
       low:Math.min(...k.list.map(x=>Number(x[3])))
      };
     }catch(e){return null;}
    }));
    coins.push(...rows.filter(Boolean));
    document.getElementById("status").textContent=
     "Завантажено рівні: "+coins.length+" / "+symbols.length;
   }
  }

  const tickers=await get("/v5/market/tickers?category=linear");
  const prices={};
  tickers.list.forEach(x=>prices[x.symbol]=Number(x.lastPrice));
  coins.forEach(c=>c.price=prices[c.symbol]);

  if(Date.now()-lastTouchScan>120000){
   document.getElementById("status").textContent=
    "Перевіряю, чи торкалися монети рівнів...";
   await scanTouches(today);
  }

  render();
  document.getElementById("status").textContent=
   "День: "+today+" · Монет: "+coins.length+
   " · Оновлено: "+new Date().toLocaleTimeString();
 }catch(e){
  document.getElementById("status").textContent="Помилка: "+e.message;
 }
 loading=false;
}

function render(){
 const q=document.getElementById("search").value.toUpperCase();
 const list=document.getElementById("list");
 list.innerHTML="";

 coins.filter(c=>
  c.symbol.includes(q)&&c.price>0&&!touched[c.symbol]
 ).forEach(c=>{
  const hd=Math.abs(c.price-c.high)/c.high*100;
  const ld=Math.abs(c.price-c.low)/c.low*100;
  let signal="";

  if(c.price<=c.high&&hd<=LIMIT)
   signal+='<div class="yellow">⚠️ Близько до максимуму</div>';
  if(c.price>=c.low&&ld<=LIMIT)
   signal+='<div class="yellow">⚠️ Близько до мінімуму</div>';

  if(!signal)return;

  list.innerHTML+=`
   <div class="card">
    <b>${c.symbol}</b>
    <p>Ціна: ${c.price}</p>
    <div class="green">Вчорашній максимум: ${c.high} · ${hd.toFixed(2)}%</div>
    <div class="red">Вчорашній мінімум: ${c.low} · ${ld.toFixed(2)}%</div>
    ${signal}
   </div>`;
 });
}

load();
setInterval(load,30000);
</script>
</body>
</html>
