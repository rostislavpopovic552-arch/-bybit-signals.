<script>
const API = "https://api.bybit.com";
const $ = id => document.getElementById(id);

let running = false;
let busy = false;
let timer = null;
let symbols = [];
let signals = [];

let trades = JSON.parse(localStorage.getItem("paperTrades") || "[]");
let state = JSON.parse(localStorage.getItem("paperState") || "{}");

let processed = new Set(state.processed || []);
let dayKey = new Date().toISOString().slice(0,10);

let dailyTrades = state.day === dayKey ? (state.dailyTrades || 0) : 0;
let losses = state.day === dayKey ? (state.losses || 0) : 0;

function save() {
  localStorage.setItem("paperTrades", JSON.stringify(trades));
  localStorage.setItem("paperState", JSON.stringify({
    day: dayKey,
    dailyTrades,
    losses,
    processed: [...processed].slice(-1000)
  }));
}

function resetDay() {
  const today = new Date().toISOString().slice(0,10);
  if (today !== dayKey) {
    dayKey = today;
    dailyTrades = 0;
    losses = 0;
    save();
  }
}

async function api(path) {
  const response = await fetch(API + path);
  if (!response.ok) throw Error("Помилка Bybit: " + response.status);

  const json = await response.json();
  if (json.retCode !== 0) throw Error(json.retMsg);

  return json.result;
}

async function loadSymbols() {
  const result = await api(
    "/v5/market/instruments-info?category=linear&limit=1000&settleCoin=USDT"
  );

  return result.list
    .filter(x =>
      x.status === "Trading" &&
      x.contractType === "LinearPerpetual" &&
      x.symbol.endsWith("USDT")
    )
    .map(x => x.symbol);
}

async function tickerMap() {
  const result = await api("/v5/market/tickers?category=linear");
  return Object.fromEntries(
    result.list.map(x => [x.symbol, x])
  );
}

async function candles(symbol) {
  const result = await api(
    "/v5/market/kline?category=linear&symbol=" +
    symbol + "&interval=5&limit=60"
  );

  return result.list.map(x => ({
    time: Number(x[0]),
    open: Number(x[1]),
    high: Number(x[2]),
    low: Number(x[3]),
    close: Number(x[4])
  })).reverse();
}

/*
  Сигнал формується тільки тоді,
  коли остання закрита M5-свічка є ретестом.
*/

function findSetup(candles) {
  const a = candles.slice(0, -1);

  if (a.length < 20) return null;

  const last = a.length - 1;

  // Не шукаємо старі сигнали.
  const latestClose = a[last].time + 5 * 60 * 1000;

  if (Date.now() - latestClose > 5 * 60 * 1000) {
    return null;
  }

  for (let i = Math.max(10, last - 10); i <= last - 2; i++) {
    const previous = a.slice(i - 10, i);

    const support = Math.min(...previous.map(x => x.low));
    const resistance = Math.max(...previous.map(x => x.high));

    const sweep = a[i];

    // LONG: збір ліквідності під мінімумом.
    if (sweep.low < support && sweep.close > support) {
      const level = Math.max(...previous.map(x => x.high));

      let bos = false;

      for (let j = i + 1; j < last; j++) {
        if (a[j].close > level) {
          bos = true;
          break;
        }
      }

      const retest = a[last];

      if (
        bos &&
        retest.low <= level * 1.002 &&
        retest.close > level &&
        retest.close > retest.open
      ) {
        return {
          side: "LONG",
          level,
          sl: sweep.low * 0.999,
          time: retest.time,
          reason: "Sweep → BOS → Retest"
        };
      }
    }

    // SHORT: збір ліквідності над максимумом.
    if (sweep.high > resistance && sweep.close < resistance) {
      const level = Math.min(...previous.map(x => x.low));

      let bos = false;

      for (let j = i + 1; j < last; j++) {
        if (a[j].close < level) {
          bos = true;
          break;
        }
      }

      const retest = a[last];

      if (
        bos &&
        retest.high >= level * 0.998 &&
        retest.close < level &&
        retest.close < retest.open
      ) {
        return {
          side: "SHORT",
          level,
          sl: sweep.high * 1.001,
          time: retest.time,
          reason: "Sweep → BOS → Retest"
        };
      }
    }
  }

  return null;
}

function fmt(value) {
  return Number(value).toLocaleString("en-US", {
    maximumFractionDigits: 6
  });
}

function openPaper(symbol, setup, price) {
  resetDay();

  if (losses >= 2) return;
  if (dailyTrades >= 3) return;

  if (trades.some(t =>
    t.symbol === symbol && t.status === "OPEN"
  )) return;

  const id = symbol + "-" + setup.side + "-" + setup.time;

  if (processed.has(id)) return;

  const deposit = Math.max(1, Number($("deposit").value) || 1000);
  const risk = Math.min(0.5, Math.max(0.1, Number($("risk").value) || 0.5));

  const distance = Math.abs(price - setup.sl);

  if (!distance) return;
  if (distance / price > 0.025) return;

  // Не відкриваємо угоду, якщо ціна вже далеко від рівня ретесту.
  if (Math.abs(price - setup.level) / price > 0.003) return;

  if (setup.side === "LONG" && price <= setup.sl) return;
  if (setup.side === "SHORT" && price >= setup.sl) return;

  const riskMoney = deposit * risk / 100;
  const qty = riskMoney / distance;

  const direction = setup.side === "LONG" ? 1 : -1;

  const trade = {
    id,
    symbol,
    side: setup.side,
    entry: price,
    sl: setup.sl,
    level: setup.level,
    qty,
    initialQty: qty,
    tp1: price + direction * distance,
    tp2: price + direction * distance * 2,
    tp3: price + direction * distance * 3,
    r: distance,
    realized: 0,
    status: "OPEN",
    opened: Date.now(),
    hit1: false,
    hit2: false
  };

  trades.unshift(trade);
  processed.add(id);
  dailyTrades++;

  save();
}

function closeQty(t, price, qty) {
  const q = Math.min(t.qty, qty);
  if (q <= 0) return;

  const direction = t.side === "LONG" ? 1 : -1;

  t.realized += (price - t.entry) * direction * q;
  t.qty -= q;

  if (t.qty < t.initialQty * 0.000001) {
    t.qty = 0;
  }
}

function finish(t, price) {
  if (t.qty > 0) {
    closeQty(t, price, t.qty);
  }

  t.status = "CLOSED";
  t.closed = Date.now();

  if (t.realized < 0) {
    losses++;
  } else {
    losses = 0;
  }

  save();
}

function updateTrades(prices) {
  resetDay();

  for (const t of trades) {
    if (t.status !== "OPEN") continue;

    const price = prices[t.symbol];
    if (!price) continue;

    const third = t.initialQty / 3;

    if (t.side === "LONG") {
      if (price <= t.sl) {
        finish(t, t.sl);
        continue;
      }

      if (!t.hit1 && price >= t.tp1) {
        closeQty(t, t.tp1, third);
        t.hit1 = true;
      }

      if (!t.hit2 && price >= t.tp2) {
        closeQty(t, t.tp2, third);
        t.hit2 = true;
      }

      if (price >= t.tp3) {
        finish(t, t.tp3);
      }

    } else {
      if (price >= t.sl) {
        finish(t, t.sl);
        continue;
      }

      if (!t.hit1 && price <= t.tp1) {
        closeQty(t, t.tp1, third);
        t.hit1 = true;
      }

      if (!t.hit2 && price <= t.tp2) {
        closeQty(t, t.tp2, third);
        t.hit2 = true;
      }

      if (price <= t.tp3) {
        finish(t, t.tp3);
      }
    }
  }

  save();
}

function render() {
  $("pairs").textContent = symbols.length;

  $("signalCount").textContent = signals.length;

  $("openCount").textContent =
    trades.filter(t => t.status === "OPEN").length;

  $("closedCount").textContent =
    trades.filter(t => t.status === "CLOSED").length;

  $("signals").innerHTML = signals.length
    ? `<table>
      <thead>
        <tr>
          <th>Пара</th>
          <th>Напрямок</th>
          <th>Вхід</th>
          <th>SL</th>
          <th>Причина</th>
        </tr>
      </thead>
      <tbody>
        ${signals.map(s => `
          <tr>
            <td>${s.symbol}</td>
            <td class="${s.side.toLowerCase()}">${s.side}</td>
            <td>${fmt(s.entry)}</td>
            <td>${fmt(s.sl)}</td>
            <td>${s.reason}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>`
    : "Актуальних сигналів поки немає.";

  const recent = trades.slice(0, 30);

  $("trades").innerHTML = recent.length
    ? `<table>
      <thead>
        <tr>
          <th>Пара</th>
          <th>Напрямок</th>
          <th>Вхід</th>
          <th>SL</th>
          <th>TP1</th>
          <th>TP2</th>
          <th>TP3</th>
          <th>Статус</th>
          <th>P/L $</th>
        </tr>
      </thead>
      <tbody>
        ${recent.map(t => `
          <tr>
            <td>${t.symbol}</td>
            <td class="${t.side.toLowerCase()}">${t.side}</td>
            <td>${fmt(t.entry)}</td>
            <td>${fmt(t.sl)}</td>
            <td>${fmt(t.tp1)}</td>
            <td>${fmt(t.tp2)}</td>
            <td>${fmt(t.tp3)}</td>
            <td>${t.status}</td>
            <td>${t.realized.toFixed(2)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>`
    : "Угод ще немає.";

  $("riskStatus").textContent =
    "Угод сьогодні: " + dailyTrades +
    ". Збитків поспіль: " + losses +
    ". " + (losses >= 2
      ? "Зупинка після двох збитків."
      : "Денний ліміт активний.");
}

async function scan() {
  if (busy || !running) return;

  busy = true;

  $("status").textContent = "● Сканування ринку...";

  try {
    resetDay();

    if (!symbols.length) {
      symbols = await loadSymbols();
    }

    const tickers = await tickerMap();

    const ranked = symbols
      .filter(s => tickers[s])
      .sort((a,b) =>
        Number(tickers[b].turnover24h) -
        Number(tickers[a].turnover24h)
      )
      .slice(0,25);

    const prices = {};

    for (const symbol of symbols) {
      if (tickers[symbol]) {
        // Оновлюємо ціни відкритих позицій.
        if (trades.some(t =>
          t.symbol === symbol && t.status === "OPEN"
        )) {
          prices[symbol] = Number(tickers[symbol].lastPrice);
        }
      }
    }

    // Спочатку перевіряємо старі угоди.
    updateTrades(prices);

    const found = [];

    for (let i = 0; i < ranked.length; i += 4) {
      const batch = ranked.slice(i, i + 4);

      const results = await Promise.all(
        batch.map(async symbol => {
          try {
            const candlesData = await candles(symbol);
            const setup = findSetup(candlesData);

            if (!setup) return null;

            const price = Number(tickers[symbol].lastPrice);

            if (!price) return null;

            return {
              symbol,
              ...setup,
              entry: price
            };

          } catch (e) {
            return null;
          }
        })
      );

      found.push(...results.filter(Boolean));
    }

    signals = found;

    for (const s of signals) {
      openPaper(s.symbol, s, s.entry);
    }

    $("updated").textContent =
      "Оновлено: " + new Date().toLocaleTimeString();

    $("status").textContent = "● Сканер працює";

  } catch (e) {
    $("status").textContent = "Помилка: " + e.message;
  } finally {
    busy = false;
    render();
  }
}

function start() {
  if (running) return;

  running = true;

  $("status").textContent = "● Запуск сканера...";

  scan();

  const minutes = Math.max(
    1,
    Math.min(30, Number($("interval").value) || 5)
  );

  timer = setInterval(scan, minutes * 60000);
}

function stop() {
  running = false;
  clearInterval(timer);

  $("status").textContent = "● Зупинено";
}

$("startBtn").onclick = start;
$("stopBtn").onclick = stop;

$("resetBtn").onclick = () => {
  if (!confirm("Видалити всі віртуальні угоди та журнал?")) return;

  trades = [];
  signals = [];
  processed.clear();
  dailyTrades = 0;
  losses = 0;

  save();
  render();
};

render();
</script>
